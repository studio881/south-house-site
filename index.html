<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>South House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    /* Center the static logo */
    .entrance-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      gap: 2.5rem;
    }

    .logo-container {
      width: 180px;
      height: 180px;
      background: #111;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(201, 77, 106, 0.2);
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Centered "Click to Enter" link */
    .enter-link {
      font-family: 'Anton', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      padding-bottom: 3px;
      transition: color 0.2s, border-color 0.2s;
    }
    .enter-link:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.9);
    }

    /* Sign Up button at the bottom */
    .signup-container {
      position: fixed;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .signup-btn {
      display: inline-block;
      padding: 0.85rem 2.25rem;
      font-family: 'Anton', monospace;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      transition: border-color 0.2s, background 0.2s;
    }
    .signup-btn:hover {
      border-color: rgba(255, 255, 255, 0.95);
      background: rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 600px) {
      .logo-container { width: 140px; height: 140px; }
      .enter-link { font-size: 1rem; }
      .signup-container { bottom: 2rem; }
      .signup-btn { padding: 0.75rem 1.75rem; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <div class="entrance-wrap">
    <div class="logo-container">
      <img src="assets/sh-logo-diamond.png" alt="South House">
    </div>
    
    <a href="home.html" class="enter-link" aria-label="Enter South House">Click to Enter</a>
  </div>

  <!-- Sign Up button at the bottom -->
  <div class="signup-container">
    <a href="signup.html" class="signup-btn">Sign Up</a>
  </div>

</body>
</html>
