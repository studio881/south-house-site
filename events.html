          <div id="featured-events-zone">
            <div class="event-card--loading">Loading events...</div>
          </div>
        </section>

        <!-- Zone 2: Past Events Archive (CMS-driven) -->
        <section class="section">
          <details class="past-events-dropdown">
            <summary class="past-events-summary">Past Events</summary>
            <div class="past-events-content" id="archived-events-zone">
              <div class="event-card--loading">Loading archive...</div>
            </div>
          </details>
        </section>

  <script>
    function toggleMenu() {
      const dropdown = document.getElementById('mobileDropdown');
      const toggle = document.querySelector('.menu-toggle');
      dropdown.classList.toggle('open');
      toggle.textContent = dropdown.classList.contains('open') ? 'Close' : 'Menu';
    }
  </script>
